<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <filter id="setShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#163C3C" flood-opacity="0.20"/>
    </filter>
    <clipPath id="setWin"><rect x="12" y="14" width="376" height="222" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="250" fill="#EAF5F6"/>
  <rect x="12" y="14" width="376" height="222" rx="12" fill="#FFFFFF"/>
  <g clip-path="url(#setWin)">
    <!-- tab strip -->
    <path d="M12 36V26a12 12 0 0 1 12-12h352a12 12 0 0 1 12 12v10z" fill="#EFF5F6"/>
    <rect x="24" y="20" width="112" height="22" rx="7" fill="#FFFFFF"/>
    <circle cx="37" cy="31" r="5" fill="#09A99E"/>
    <path d="M34.5 31h5M37 28.5v5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <text x="47" y="35" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#3C4043">MediBook</text>
    <!-- address bar with the lock -->
    <rect x="24" y="54" width="250" height="22" rx="11" fill="#F1F3F4"/>
    <rect x="34" y="64" width="11" height="8" rx="2" fill="#5F6368"/>
    <path d="M36.5 64v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#5F6368" stroke-width="1.6"/>
    <text x="50" y="69.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5F6368">https://medibook.app</text>
    <rect x="12" y="84" width="376" height="1" fill="#E4EAEB"/>
    <!-- page behind -->
    <rect x="12" y="85" width="376" height="151" fill="#F3FAFA"/>
    <rect x="34" y="104" width="150" height="13" rx="6.5" fill="#DDECEB"/>
    <rect x="34" y="126" width="240" height="9" rx="4.5" fill="#E7F2F1"/>
    <rect x="34" y="142" width="200" height="9" rx="4.5" fill="#E7F2F1"/>
    <!-- lock dropdown menu -->
    <rect x="28" y="90" width="184" height="118" rx="10" fill="#FFFFFF" filter="url(#setShadow)"/>
    <circle cx="48" cy="112" r="8" fill="#E7F7F5"/>
    <rect x="44" y="111" width="8" height="7" rx="1.6" fill="none" stroke="#09A99E" stroke-width="1.6"/>
    <path d="M46 111v-2a2 2 0 0 1 4 0v2" fill="none" stroke="#09A99E" stroke-width="1.6"/>
    <text x="64" y="116" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3C4043">Connection is secure</text>
    <rect x="38" y="128" width="164" height="1" fill="#EEF2F2"/>
    <text x="44" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3C4043">Cookies and site data</text>
    <rect x="38" y="158" width="164" height="1" fill="#EEF2F2"/>
    <rect x="36" y="164" width="168" height="30" rx="8" fill="#E7F7F5"/>
    <text x="44" y="184" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#087F79">Site settings</text>
  </g>
  <!-- highlight on Site settings -->
  <rect x="32" y="160" width="176" height="38" rx="10" fill="none" stroke="#09A99E" stroke-width="2.5"/>
  <path d="M216 178l14-14m0 0h-9m9 0v9" fill="none" stroke="#09A99E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
