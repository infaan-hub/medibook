<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <filter id="notiShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#163C3C" flood-opacity="0.20"/>
    </filter>
    <clipPath id="notiWin"><rect x="12" y="14" width="376" height="222" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="250" fill="#EAF5F6"/>
  <rect x="12" y="14" width="376" height="222" rx="12" fill="#FFFFFF"/>
  <g clip-path="url(#notiWin)">
    <!-- tab strip -->
    <path d="M12 36V26a12 12 0 0 1 12-12h352a12 12 0 0 1 12 12v10z" fill="#EFF5F6"/>
    <rect x="24" y="20" width="112" height="22" rx="7" fill="#FFFFFF"/>
    <circle cx="37" cy="31" r="5" fill="#09A99E"/>
    <path d="M34.5 31h5M37 28.5v5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <text x="47" y="35" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#3C4043">MediBook</text>
    <!-- address bar -->
    <rect x="24" y="54" width="250" height="22" rx="11" fill="#F1F3F4"/>
    <rect x="34" y="64" width="11" height="8" rx="2" fill="#5F6368"/>
    <path d="M36.5 64v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#5F6368" stroke-width="1.6"/>
    <text x="50" y="69.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5F6368">https://medibook.app</text>
    <circle cx="370" cy="59" r="2" fill="#5F6368"/>
    <circle cx="370" cy="65" r="2" fill="#5F6368"/>
    <circle cx="370" cy="71" r="2" fill="#5F6368"/>
    <rect x="12" y="84" width="376" height="1" fill="#E4EAEB"/>
    <!-- the MediBook page behind the pop-up -->
    <rect x="12" y="85" width="376" height="151" fill="#F7FAFA"/>
    <rect x="12" y="85" width="376" height="34" fill="#09A99E"/>
    <rect x="26" y="92" width="19" height="19" rx="5" fill="#FFFFFF"/>
    <path d="M33 101.5h5M35.5 99v5" stroke="#09A99E" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="106" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">MediBook</text>
    <rect x="186" y="130" width="160" height="72" rx="10" fill="#EAF3F3"/>
    <rect x="198" y="144" width="90" height="9" rx="4.5" fill="#CFE4E3"/>
    <rect x="198" y="162" width="130" height="9" rx="4.5" fill="#CFE4E3"/>
    <rect x="198" y="180" width="70" height="9" rx="4.5" fill="#CFE4E3"/>
  </g>
  <!-- the real notification permission pop-up -->
  <rect x="30" y="92" width="246" height="118" rx="10" fill="#FFFFFF" stroke="#DADCE0" filter="url(#notiShadow)"/>
  <circle cx="58" cy="124" r="16" fill="#E8F0FE"/>
  <path d="M58 114a7 7 0 0 0-7 7v5l-2.2 3.2h18.4L55 126v-5a7 7 0 0 0-7-7z" fill="#1A73E8"/>
  <path d="M55 131.5a3 3 0 0 0 6 0" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="82" y="118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#202124">medibook.app wants to send</text>
  <text x="82" y="136" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#202124">you notifications</text>
  <text x="44" y="156" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5F6368">https://medibook.app</text>
  <text x="164" y="187" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6368">Block</text>
  <rect x="200" y="168" width="60" height="28" rx="8" fill="#E8F0FE"/>
  <text x="230" y="187" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1A73E8">Allow</text>
  <rect x="196" y="164" width="68" height="36" rx="11" fill="none" stroke="#09A99E" stroke-width="2.5"/>
  <path d="M266 188l0 24 5.5-5.5 4.5 9.5 5-2.3-4.5-9 8.5 0z" fill="#163C3C" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M288 176l-10 6 10 6z" fill="#09A99E"/>
  <rect x="288" y="164" width="94" height="36" rx="18" fill="#09A99E"/>
  <text x="335" y="187" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Tap Allow</text>
</svg>
