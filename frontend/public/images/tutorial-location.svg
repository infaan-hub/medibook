<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <filter id="locShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#163C3C" flood-opacity="0.20"/>
    </filter>
    <clipPath id="locWin"><rect x="12" y="14" width="376" height="222" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="250" fill="#EAF5F6"/>
  <rect x="12" y="14" width="376" height="222" rx="12" fill="#FFFFFF"/>
  <g clip-path="url(#locWin)">
    <!-- tab strip -->
    <path d="M12 36V26a12 12 0 0 1 12-12h352a12 12 0 0 1 12 12v10z" fill="#EFF5F6"/>
    <rect x="24" y="20" width="112" height="22" rx="7" fill="#FFFFFF"/>
    <circle cx="37" cy="31" r="5" fill="#09A99E"/>
    <path d="M34.5 31h5M37 28.5v5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <text x="47" y="35" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#3C4043">MediBook</text>
    <!-- address bar -->
    <rect x="24" y="54" width="250" height="22" rx="11" fill="#F1F3F4"/>
    <rect x="34" y="64" width="11" height="8" rx="2" fill="#5F6368"/>
    <path d="M36.5 64v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#5F6368" stroke-width="1.6"/>
    <text x="50" y="69.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5F6368">https://medibook.app</text>
    <circle cx="370" cy="59" r="2" fill="#5F6368"/>
    <circle cx="370" cy="65" r="2" fill="#5F6368"/>
    <circle cx="370" cy="71" r="2" fill="#5F6368"/>
    <rect x="12" y="84" width="376" height="1" fill="#E4EAEB"/>
    <!-- map the user will see behind the pop-up -->
    <rect x="12" y="85" width="376" height="151" fill="#E7F1E4"/>
    <rect x="24" y="94" width="86" height="42" rx="6" fill="#D8E7D2"/>
    <rect x="150" y="96" width="96" height="40" rx="6" fill="#D8E7D2"/>
    <rect x="292" y="160" width="80" height="46" rx="8" fill="#C9E3BE"/>
    <path d="M12 150H388" stroke="#FFFFFF" stroke-width="9"/>
    <path d="M130 85V236" stroke="#FFFFFF" stroke-width="9"/>
    <path d="M270 85V236" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M12 205H388" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M320 160s13-12 13-21a13 13 0 1 0-26 0c0 9 13 21 13 21z" fill="#E53935"/>
    <circle cx="320" cy="139" r="5" fill="#FFFFFF"/>
    <path d="M300 218s9-8 9-15a9 9 0 1 0-18 0c0 7 9 15 9 15z" fill="#09A99E"/>
    <circle cx="300" cy="203" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- the real permission pop-up -->
  <rect x="30" y="92" width="232" height="118" rx="10" fill="#FFFFFF" stroke="#DADCE0" filter="url(#locShadow)"/>
  <text x="44" y="118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124">medibook.app wants to know</text>
  <text x="44" y="136" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124">your location</text>
  <text x="44" y="155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5F6368">https://medibook.app</text>
  <text x="150" y="187" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6368">Block</text>
  <rect x="186" y="168" width="60" height="28" rx="8" fill="#E8F0FE"/>
  <text x="216" y="187" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1A73E8">Allow</text>
  <rect x="182" y="164" width="68" height="36" rx="11" fill="none" stroke="#09A99E" stroke-width="2.5"/>
  <path d="M252 188l0 24 5.5-5.5 4.5 9.5 5-2.3-4.5-9 8.5 0z" fill="#163C3C" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M278 176l-10 6 10 6z" fill="#09A99E"/>
  <rect x="278" y="164" width="104" height="36" rx="18" fill="#09A99E"/>
  <text x="330" y="187" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Tap Allow</text>
</svg>
